[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agnes-ai-sdk"
version = "0.1.0"
description = "Python SDK for Agnes AI APIs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
